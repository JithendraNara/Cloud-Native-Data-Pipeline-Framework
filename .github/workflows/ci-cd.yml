name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.5.0
  PYTHON_VERSION: '3.12'

jobs:
  # ─── Lint + test the Python code ───
  lint-and-test:
    name: Lint & Test Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda/ingestion/requirements.txt
          pip install -r ai_analyst/requirements.txt
          pip install flake8 black isort pytest pytest-cov dbt-duckdb duckdb

      - name: Lint
        run: |
          flake8 lambda/ ai_analyst/ scripts/ data_quality/ --max-line-length=120 --ignore=E501,W503
          black --check lambda/ ai_analyst/ scripts/ data_quality/
          isort --check-only lambda/ ai_analyst/ scripts/ data_quality/

      - name: Generate sample data
        run: python scripts/generate_sample_data.py --rows 1000 --output sample/events.json

      - name: Seed DuckDB
        run: python scripts/local_seed.py

      - name: dbt build (DuckDB local target)
        working-directory: dbt
        run: |
          mkdir -p ~/.dbt
          cp profiles.yml.example ~/.dbt/profiles.yml
          DBT_PROFILES_DIR=~/.dbt dbt build --profile data_pipeline --target local

      - name: Data quality (DuckDB backend override)
        run: |
          ICEBERG_GOLD_NAMESPACE=gold python -c "
          import duckdb
          con = duckdb.connect('dbt/dbt.duckdb')
          rows = con.sql('SELECT COUNT(*) FROM gold_dev.daily_user_revenue').fetchone()
          print(f'Gold daily_user_revenue rows: {rows[0]}')
          assert rows[0] > 0, 'dbt build did not produce any rows'
          "

      - uses: codecov/codecov-action@v4
        with: file: ./coverage.xml
        continue-on-error: true

  # ─── Validate the AI analyst imports ───
  ai-analyst-build:
    name: AI Analyst Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: pip install -r ai_analyst/requirements.txt
      - name: Compile-check
        run: |
          python -c "from ai_analyst.server import app; print('OK')"
      - name: Boot health check
        run: |
          uvicorn ai_analyst.server:app --host 127.0.0.1 --port 8765 &
          sleep 3
          curl -fsS http://127.0.0.1:8765/health
          kill %1 2>/dev/null || true

  # ─── Terraform format + validate ───
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: terraform fmt
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: terraform init
        run: terraform init -backend=false
        working-directory: terraform/environments/dev

      - name: terraform validate
        run: terraform validate
        working-directory: terraform/environments/dev

  # ─── Build + push container images on main ───
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-test, ai-analyst-build, terraform]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        target: [ai-analyst, ingestion]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.target == 'ai-analyst' && 'ai_analyst' || 'lambda/ingestion' }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.target }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Security scan ───
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - uses: github/codeql-action/upload-sarif@v3
        with: sarif_file: 'trivy-results.sarif'
